[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "member2-dense-rag"
version = "0.3.1"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "faiss-cpu>=1.8,<2", "sentence-transformers>=3,<7", "pyarrow>=16,<27"]

[project.scripts]
dense-rag = "dense_rag.cli:main"

[tool.setuptools.packages.find]
include = ["dense_rag*"]
