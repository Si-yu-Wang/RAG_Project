[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-data"
version = "0.1.0"
description = "Dataset & Chunking pipeline for the QASPER-based RAG project (Member 1)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "transformers>=4.41",
    "tokenizers>=0.19",
    "pysbd>=0.3.4",
    "rapidfuzz>=3.9",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5", "black>=24.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.black]
line-length = 100
